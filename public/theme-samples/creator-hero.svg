    <circle cx="740" cy="740" r="6"/><circle cx="660" cy="740" r="6"/><circle cx="580" cy="740" r="6"/><circle cx="740" cy="660" r="6"/><circle cx="660" cy="660" r="6"/><circle cx="740" cy="580" r="6"/>
  </g>
