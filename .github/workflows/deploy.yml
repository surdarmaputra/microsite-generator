name: Deploy

on:
  push:
    branches: [main, claude/vibrant-wright-w5l90b, claude/gallant-brown-gxjpka]
  workflow_dispatch:

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-migration
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run migrations
        run: bun run migrate
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}

  deploy-prod:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/vibrant-wright-w5l90b' || github.ref == 'refs/heads/claude/gallant-brown-gxjpka'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run migrations
        continue-on-error: true
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: bun run migrate
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PUBLIC_STORAGE_URL: ${{ vars.PUBLIC_STORAGE_URL }}
      - name: Deploy prod to Netlify
        run: bunx netlify deploy --prod --dir dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
