name: Deploy

on:
  push:
    branches: [main, claude/vibrant-wright-w5l90b]
  pull_request:
  workflow_dispatch:

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PUBLIC_STORAGE_URL: ${{ vars.PUBLIC_STORAGE_URL }}
      - name: Deploy preview to Netlify
        run: bunx netlify deploy --alias pr-${{ github.event.number }} --dir dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - name: Run smoke tests
        run: bun run test:smoke
        env:
          BASE_URL: https://pr-${{ github.event.number }}--${{ vars.NETLIFY_SITE_NAME }}.netlify.app
          TEST_USERNAME: ${{ vars.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-migration
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run migrations
        run: bun run migrate
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}

  deploy-prod:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/vibrant-wright-w5l90b') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run migrations
        if: ${{ secrets.DATABASE_URL_MIGRATE != '' }}
        env:
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: bun run migrate
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PUBLIC_STORAGE_URL: ${{ vars.PUBLIC_STORAGE_URL }}
      - name: Deploy prod to Netlify
        run: bunx netlify deploy --prod --dir dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
