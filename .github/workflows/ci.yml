name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test:coverage

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microsite_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install chromium --with-deps
      - name: Create S3 bucket in MinIO
        run: |
          curl -sf http://localhost:9000/minio/health/live || sleep 5
          bunx --yes @aws-sdk/client-s3 || true
          curl -X PUT "http://minioadmin:minioadmin@localhost:9000/microsites" || true
      - name: Migrate DB
        env:
          DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/microsite_test
        run: bun run migrate
      - name: Run e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/microsite_test?sslmode=disable
          DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/microsite_test
          ADMIN_USERS: admin:${{ secrets.TEST_ADMIN_HASH }}
          SESSION_SECRET: test-secret-32-chars-minimum-xxxx
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: microsites
          PUBLIC_STORAGE_URL: http://localhost:9000/microsites
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: bun run test:e2e

  coverage:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
